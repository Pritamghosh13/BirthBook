<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — BirthBook</title>
  <link rel="stylesheet" href="dasboard.style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Quicksand:wght@500;600;700&family=Nunito:wght@800;900&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Background Orbs -->
  <div class="glow-orb orb-1"></div>
  <div class="glow-orb orb-2"></div>

  <!-- Navbar -->
  <nav id="navbar">
    <a href="dashboard.html" class="nav-brand">
      <div class="brand-icon">🎉</div>
      <span>BirthBook</span>
    </a>
    <div class="nav-links">
      <a href="dashboard.html" class="nav-link active">Dashboard</a>
      <a href="profile.html" class="nav-link">Profile</a>
      <button id="logoutBtn" class="btn-logout">Logout</button>
    </div>
  </nav>

  <!-- Main Container -->
  <main class="dashboard-container">
    
    <!-- Welcome Header -->
    <header class="welcome-hero">
      <div class="hero-left">
        <div class="user-badge">Logged In</div>
        <h1 id="welcomeUser">Welcome back!</h1>
        <p id="userBirthdayCountdown">Loading your birthday info...</p>
      </div>
      <div class="hero-right">
        <div class="profile-avatar-container" onclick="window.location.href='profile.html'">
          <img id="currentUserAvatar" src="" alt="Profile Avatar" style="display: none;">
          <div id="currentUserAvatarFallback" class="avatar-fallback">BB</div>
        </div>
      </div>
    </header>

    <!-- Stats & Filters Section -->
    <section class="control-panel">
      <div class="search-box-wrapper">
        <span class="search-icon">🔍</span>
        <input type="text" id="searchInput" placeholder="Search friends by name or email...">
      </div>
      <div class="stats-row">
        <div class="stat-card">
          <span class="stat-value" id="totalFriendsCount">0</span>
          <span class="stat-label">Total Friends</span>
        </div>
        <div class="stat-card accent-pink">
          <span class="stat-value" id="upcomingMonthCount">0</span>
          <span class="stat-label">This Month</span>
        </div>
      </div>
    </section>

    <!-- Upcoming Birthdays Section -->
    <section class="birthdays-section">
      <div class="section-header">
        <h2>Upcoming Birthdays</h2>
        <span class="section-tag">Next 30 Days</span>
      </div>
      <div id="upcomingContainer" class="upcoming-carousel">
        <div class="loading-spinner">Checking upcoming celebrations...</div>
      </div>
    </section>

    <!-- All Friends Section -->
    <section class="birthdays-section">
      <div class="section-header">
        <h2>All Friends</h2>
        <span class="section-tag" id="allFriendsCountTag">Total: 0</span>
      </div>
      <div id="friendsGrid" class="friends-grid">
        <div class="loading-spinner">Gathering birthday records...</div>
      </div>
    </section>

  </main>

  <footer>
    <p>Created with <span>💖</span> by Pritam Ghosh. All rights reserved.</p>
  </footer>

  <script src="dashboard.script.js"></script>
</body>
</html>
